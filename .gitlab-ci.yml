workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - quality

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  # Full history is required for blame / new-code detection in Sonar analysis.
  GIT_DEPTH: "0"

unit-test:
  stage: test
  image: eclipse-temurin:25-jdk
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ant
  script:
    - ant test
  coverage: '/Total line coverage: ([0-9.]+)%/'
  artifacts:
    when: always
    reports:
      junit: build/test-results/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: build/jacoco/jacoco.xml
    paths:
      - build/test-results/
      - build/bin/
      - build/test-bin/
      # XML only (HTML is large); Sonar and GitLab visualization both consume this file.
      - build/jacoco/jacoco.xml
    expire_in: 1 hour

# Full distribution build (jars + Dashboard.jar + L2Journey.zip). Separate from unit-test
# so the default Ant cleanup target does not wipe JaCoCo artifacts used by Sonar.
package:
  stage: build
  image: eclipse-temurin:25-jdk
  needs:
    - job: unit-test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ant
  script:
    - ant
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

sonarcloud-check:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs:
    - job: unit-test
      artifacts: true
  # No job cache: Docker Desktop runners fail preparing the GitLab cache volume for this image.
  script:
    - sonar-scanner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # First analyses often fail a strict quality gate on legacy findings; keep the pipeline green until the profile/gate are tuned.
  allow_failure: true
