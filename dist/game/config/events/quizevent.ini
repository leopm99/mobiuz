#Set this to true to activate the Quiz Event.
#Default: false
EnableQuizEvent = true

#The time for the first time to event run after a server restart in seconds.
#Default: 600 seconds (10 minutes).
QuizStartingTime = 50

#The interval time in seconds between the event rounds after the first running.
#Default: 3600 seconds (1 hour).
QuizIntervalTime = 600

#The minimum of players online to start the Quiz Event.
#Default: 30
QuizAnsweringTime = 20

#The number of questions when the event run.
#Default: 5
QuestionNumber = 5

#The ID of the event reward for each correct question answered.
#Default: 9627 (Giant's Codex: Mastery).
QuizRewardId = 9627

#The amount of item reward for each correct answer in event.
#Default: 1.
QuizRewardCount = 1