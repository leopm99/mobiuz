# Vote Reward System
# Disabled until the SQL tables, site credentials and APIs are configured.
# Endpoints below come from the legacy patch and are not yet verified.
# Update/check intervals are minutes; IntervalTimeToNextVote is hours.
# VotingCommand has no leading dot. Rewards are in data/votesystem.xml.
# NextTimeToAutoCleanInnecesaryVotes is legacy; cleanup uses the individual update task.
# Keep ItopzZpiKey spelling to match Config.java.
# L2Servers global threshold is 25 times GlobalVotesAmountToNextReward.

EnableVoteSystem = False

EnableGlobalVote = True

EnableIndividualVote = True

## Time to Update table totalVotes from DB
NextTimeToAutoUpdateTotalVote = 60

## Time to update table individualVotes
NextTimeToAutoUpdateIndividualVotes = 60

NextTimeToAutoCleanInnecesaryVotes = 30

NextTimeToCheckAutoGlobalVotesReward = 5

IntervalTimeToNextVote = 12

GlobalVotesAmountToNextReward = 50

EnableVotingCommand = True

VotingCommand = getreward

