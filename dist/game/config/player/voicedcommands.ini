# ---------------------------------------------------------------------------
# Voiced Commands Settings
# ---------------------------------------------------------------------------

# Enable or disable tomob voiced command.
# Default = true.
EnableToMobCommand = True

# The command to use. Format: .command [mob name].
# Default = .mob
ToMobCommand = mob

# Allow to use the coomand only in peace zone.
# Default = False
ToMobCommandPeaceZoneOnly = false

# Allow to use the coomand for free.
# Default = False
ToMobCommandItemFree = true

# The time (in seconds) casting the scape to move to the mob when using the command.
# Default = 20
ToMobCommandScapeTime = 10

# Use it only if "ToMobCommandItemFree" = False
# The item ID consumed when using the tomob voiced command.
# Default = 57 (adena)
RequiredItemId = 57

# Use it only if "ToMobCommandItemFree" = False
# The item count consumed when using the tomob voiced command.
# Default = 1000000
RequiredItemCount = 1

# Allow to use the .siege voiced command.
# Default = False
EnableSiegeCommand = True

# Use it only if "EnableSiegeCommand" = True
# Allow to show the GNU Panel.
# Default = False
EnableGNUPanel = True

# Allow to use the .7rb voiced command.
# Default = False
EnableSevenRBVCmd = True

# Allow to use the teleports voiced coomand (.giran, dion, etc).
# Default = False
EnableTeleportsVCmd = True

# Allow to use the gotocl voiced coomand.
# Default = False
EnableTeleportToClanLeader = True

# Allow to use the gotopl voiced coomand.
# Default = False
EnableTeleportToPartyLeader = True

# The item ID consumed when using the gotocl voiced command.
# Default = 57 (adena)
ToClRequiredItemId = 57

# The item count consumed when using the gotocl voiced command.
# Default = 1000000
ToClRequiredItemCount = 1

# Allow to use the gotopl voiced coomand.
# Default = False
EnableRessCommand = True

# The item ID consumed when using the gotocl voiced command.
# Default = 57 (adena)
RessCommandItemId = 57

# The item count consumed when using the gotocl voiced command.
# Default = 1000000
RessCommandItemCount = 1


# ---------------------------------------------------------------------------
# Instance reuse reset purchase (.instancereuse / .clearinstance)
# Clears only the character's active reentry cooldown; does not reset the instance world.
# Available outside instances, combat, events and other restricted states.
# Default: False

EnableInstanceReuseClear = True

# Item charged for each confirmed reset. Default: 57 (Adena).
InstanceReuseClearItemId = 57

# Positive item quantity charged per reset. Default: 1000.
InstanceReuseClearItemCount = 1000

# Optional allowed instance REUSE IDs (not dynamic world IDs), separated by semicolons.
# Empty = all known instance IDs with an active cooldown for this character.
# Example: 139;144
InstanceReuseClearAllowedIds =
