# New PIX charges use Checkout Transparente / Orders API (POST /v1/orders).
# Use the credentials of the TEST environment for sandbox tests. The APP_USR
# prefix alone does not distinguish test credentials from production credentials.
# MercadoPagoMerchantId must match the receiving user_id of that environment.
# With MercadoPagoSandbox=True and MercadoPagoSandboxAutoApprove=True,
# payer.first_name=APRO triggers the official automatic PIX approval simulation. Use a TEST server; do not pay this QR in a bank app.
# MercadoPagoLink uses the separate Checkout Pro / Preferences integration.
# Restart after changing credentials. Existing Orders retain their account/environment snapshot.

# Sandbox only. True sends APRO (automatic simulated approval); False omits it.
# Frozen per purchase before its first request; changing this never alters an existing request.
# False allows testing unpaid requests without the APRO trigger; confirm the actual status in MP.
# Use new purchases for each scenario. Production never sends APRO.
MercadoPagoSandboxAutoApprove = False
