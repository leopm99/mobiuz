# ---------------------------------------------------------------------------
# Community Board Customizado
# ---------------------------------------------------------------------------
# Parte da communityBoard e gerada de forma dinamica onde partes aparecem apenas
# se a config estiver ativada.
# Ativa o Community Board Customizado.
# Padrao: False
CommunityBoardEnable = True

# Community Board funciona apenas em zona de paz.
# Padrao: False
CommunityBoardPeaceOnly = False

# Desativa o Community Board durante combate.
# Padrao: True
CommunityCombatDisabled = True

# Desativa o Community Board enquanto o jogador tem Karma.
# Padrao: True
CommunityKarmaDisabled = True

# Moeda usada pelo Community Board (ID do item).
# Padrao: 57 (Adena)
CommunityCurrencyId = 57


# ---------------------------------------------------------------------------
# Community Board Buffer
# ---------------------------------------------------------------------------
# Ativa o Buffer na Community.
# Tela gerada pelo sistema e ligada diretamente ao NPC Buffer ID:12
# Padrao: False
CommunityBoardBuffer = True


# ---------------------------------------------------------------------------
# Community Board Buffer Premium
# ---------------------------------------------------------------------------
# Ativa o Buffer Premium na Community, Exclusivo para players Premium.
# Requer EnablePremiumSystem = True em config/player/premiumsystem.ini.
# Se o sistema premium estiver desativado, o card fica oculto e o buffer e recusado.
# Tela gerada pelo sistema e ligada diretamente ao NPC Buffer ID:15
# Padrao: False
CommunityBoardBufferPremium = False


# ---------------------------------------------------------------------------
# Community Board DropSearch
# ---------------------------------------------------------------------------
# Ativa a Calculadora de Drops: pesquisa por item/NPC, drop/spoil, skills e atributos.
# Padrao: False
CommunityBoardDropSearch = True


# ---------------------------------------------------------------------------
# Community Board Subclass Master
# ---------------------------------------------------------------------------
# Adicionar, ativar e remover subclasses pelo Community Board.
# Mantem as regras de nivel, raca e AltSubClassWithoutQuests de player/character.ini.
# O acesso aparece em Servicos, nos Destaques do Servidor (CommunityHotFeaturesEnabled).
# Padrao: False
SubClassMasterBoard = True

# Item e quantidade cobrados somente para adicionar uma subclasse.
# Quantidade 0 desativa a cobranca. Padrao: 57 (Adena), 0 (gratis).
SubClassBuyItemId = 57
SubClassBuyItemCount = 0


# ---------------------------------------------------------------------------
# Community Board Color Change
# ---------------------------------------------------------------------------
# Troca a cor do nome ou do titulo no menu Servicos.
# As cores sao salvas e restauradas ao reconectar.
ColorChangeServiceEnabled = True

# Paleta em RGB hexadecimal (6 digitos), separada por ponto e virgula.
# Os nomes devem estar na mesma ordem. Limite: 20 cores.
ColorChangeColors = FFFFFF;FF0000;00FF00;0000FF;FFD700;FF69B4;00FFFF
ColorChangeColorNames = White;Red;Green;Blue;Gold;Pink;Cyan

# Custo por alteracao; quantidade 0 = gratis. Quantidades negativas sao invalidas.
ColorChangeItemId = 57
ColorChangeItemAmount = 0


# ---------------------------------------------------------------------------
# Community Board Teleport
# ---------------------------------------------------------------------------
# Ativa Teleportes no Community Board.
# A lista de teleports esta no final deste arquivo
# Padrao: False
CommunityEnableTeleports = True

# Preco para Teleportes pelo Community Board.
# Padrao: 0 (gratis)
CommunityTeleportPrice = 0


# ---------------------------------------------------------------------------
# Community Board BossStatus
# ---------------------------------------------------------------------------
# Ativa o painel "Raid Boss Watch" (status dos epic bosses) no Community Board.
# Padrao: False
CommunityBoardEpicStatus = True


# ---------------------------------------------------------------------------
# Painel "Destaques do Servidor"
# ---------------------------------------------------------------------------
# Quando True, exibe o menu interativo com as opcoes:
# Ranking
# Servicos
# Merchant
# Premium
# Delevel
# Recompensa Diaria
# Subclass Master
#
# So aparece se o sistema correspondente estiver ativado.
# Padrao: False
CommunityHotFeaturesEnabled = True

# Ativa painel de Ranking PvP/Pk dos players
# Padrao: False
CommunityBoardPlayerRanking = True

# Ativa Blacksmith, Symbol Maker e Warehouse no menu Servicos.
# O menu tambem aparece quando outro servico (ex.: SubClassMasterBoard) esta ativo.
# Padrao: False
CommunityBoardBlacksmith = True

# Ativa o comercio na CommunityBoard
# Padrao: False
CommunityBoardMerchant = True

# Ativa compra de premium pelo Community Board.
# Requer EnablePremiumSystem = True em config/player/premiumsystem.ini.
# Se o sistema premium estiver desativado, o Premium Manager fica oculto e
# as compras sao recusadas (sem cobrar moedas).
# Padrao: False
CommunityPremiumSystem = True
# ID do item usado para comprar premium no Community Board.
# Verifique data/html/CommunityBoard/premium/main.html
CommunityPremiumBuyCoinId = 57
# Quantidade de moedas necessaria para cada dia de premium comprado.
CommunityPremiumPricePerDay = 1000000

# Ativa Delevel (reduzir nivel) no Community Board.
# Padrao: False
CommunityEnableDelevel = True
# Preco para Delevel pelo Community Board.
# Padrao: 0 (gratis)
CommunityDelevelPrice = 0

# Ativa sistema de recompensas diarias
# Default: True
DailyRewardEnabled = True


# ---------------------------------------------------------------------------
# Banner "Dica do Dia" no Community Board
# ---------------------------------------------------------------------------
# Ativa o banner "DICA DO DIA" na home do Community Board.
# As frases sao carregadas em: ./config/CommunityTips.xml
# Padrao: True
CommunityTipsEnabled = True



