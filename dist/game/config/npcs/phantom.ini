# ---------------------------------------------------------------------------
# Phantom System - bots de farm / AI
# ---------------------------------------------------------------------------

# Ativa/Desativa o sistema de phantoms por completo.
# False = sem init de rotas, sem auto-start, sem start/create via GM/voiced.
# Comandos de stop continuam permitidos (no-op se nao houver bots).
# Padrao: True
PhantomEnable = True

# Inicia phantoms automaticamente ~60s apos o boot.
# Ignorado quando PhantomEnable = False.
# Padrao: True
PhantomAutoStart = True

# Quantos phantoms (por arma amaldicoada) deixam o farm para cacar o portador.
# Padrao: 8
PhantomCursedHunterLimit = 8
