<html>
<title>Chat</title>
<body>
<br>
<table cellpadding=4 width=300>
	<tr>
		<td align=center>
			<font color=LEVEL>Detalhes da compra</font>
		</td>
	</tr>
	<tr><td></td></tr>
	<tr>
		<td>
			<font color=LEVEL>ID local:</font> %id%
		</td>
	</tr>
	<tr>
		<td>
			<font color=LEVEL>ID %payment%:</font> %id_externo%
		</td>
	</tr>
	<tr>
		<td>
			<font color=LEVEL>Método:</font> %payment% %payment_type% %currency%
		</td>
	</tr>
	<tr>
		<td>
			<font color=LEVEL>E-mail:</font> %email%
		</td>
	</tr>
	<tr>
		<td>
			<font color=LEVEL>Status:</font> %status%
		</td>
	</tr>
	<tr>
		<td>
			<font color=LEVEL>Data:</font> %date% (irá expirar em %expiration%)
		</td>
	</tr>
	<tr>
		<td>
			<font color=LEVEL>Player:</font> %player%
		</td>
	</tr>
	<tr>
		<td>
			<font color=LEVEL>Produto:</font> %resume%
		</td>
	</tr>
</table>
%terms%
%msg%
<center>
<br>
<table cellpadding=4>
	<tr>
		%link%
		%qrcode%
		%check%
	</tr>
</table>
<br>
<table width=180 cellpadding=4>
	<tr>
		<td width=80 align=center>
			<a action="bypass donation history 1">Voltar</a>
		</td>
		<td width=80 align=center>
			<a action="bypass donation confirm %id% cancel">Cancelar</a>
		</td>
	</tr>
</table>
</center>
</body>
</html>
