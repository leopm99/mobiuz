sonar.projectKey=l2journey_l2journey
sonar.organization=l2journey
sonar.projectName=L2Journey

sonar.sources=java
sonar.tests=test/java
sonar.sourceEncoding=UTF-8
sonar.java.source=25

# Compiled by the GitLab unit-test job (Ant) and passed as CI artifacts.
sonar.java.binaries=build/bin
sonar.java.test.binaries=build/test-bin
sonar.java.libraries=dist/libs/*.jar
sonar.java.test.libraries=dist/libs/*.jar,build/bin,test/lib/*.jar

sonar.junit.reportPaths=build/test-results
sonar.coverage.jacoco.xmlReportPaths=build/jacoco/jacoco.xml

# Datapack runtime scripts and build output are out of scope for core analysis.
sonar.exclusions=dist/**,build/**,sql/**,docker/**
sonar.test.exclusions=dist/**,build/**
